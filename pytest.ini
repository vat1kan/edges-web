[pytest]
testpaths = tests/e2e
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
pythonpath = tests/e2e
timeout = 60

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s

filterwarnings = ignore

addopts = --headed=false --browser=chromium
