name: CI Tests

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests-requirements.txt
          playwright install --with-deps
      
      - name: Install dependencies for Playwright
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libffi-dev \
            libasound2 \
            libx264-dev \
            libxcb-shm0 \
            libxcb-xfixes0 \
            libxcb1 \
            libx11-xcb1 \
            libxcomposite1 \
            libxcursor1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxi6 \
            libxtst6 \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libgbm1 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libxrandr2 \
            libasound2

      - name: Run Playwright tests
        run: |
          pytest

      - name: Install xvfb
        run: sudo apt-get install -y xvfb

      - name: Run tests with xvfb
        run: xvfb-run pytest
